<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Toko Buku Online</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/script.js"></script>
  </head>
  <body>
    <header><strong> Toko Buku Komplit</strong> — Dashboard</header>
    <main>
      <div class="card">
        <h2 id="greeting"></h2>
        <p id="jam"></p>
      </div>
      <div class="card">
        <h2>Menu Utama</h2>
        <div class="menu">
          <a class="toko" href="stok.html">Informasi Stok/Katalog</a>
          <a class="toko" href="tracking.html">Tracking Pengiriman</a>
          <a class="toko" href="checkout.html">Laporan Pemesanan</a>
          <button onclick="tampilHistory()">History Transaksi</button>
        </div>
      </div>
      <button
        class="btn-danger"
        onclick="
          sessionStorage.clear();
          location.href = 'login.html';
        "
      >
        <a href="index.html" style="color: #fff; text-decoration: none"
          >Logout</a
        >
      </button>
    </main>

    <div class="modal" id="modal">
      <div class="modal-box" style="max-width: 600px">
        <h2>History Transaksi</h2>
        <div id="isiHistory"></div>
        <button
          class="btn-light"
          onclick="document.getElementById('modal').classList.remove('show')"
        >
          Tutup
        </button>
      </div>
    </div>
  </body>
</html>
